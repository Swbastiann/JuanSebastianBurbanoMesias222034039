
<form [formGroup] = 'loginForm'>
    <div class="card flex justify-content-center">
        <p-card header="Login" card [style]="{width:'360px'}">
            <div class="field">
                <input
                type="text" 
                pInputText 
                formControlName="Usuario" class="w-full" 
                name="Usuario"
                placeholder="Nombre de Usuario"
                />
            </div>
        </p-card>
    </div>
</form>
