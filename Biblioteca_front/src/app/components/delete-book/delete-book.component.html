<div class="container">
    <h2>Eliminar Libro</h2>
    <form [formGroup]="buscarForm" (ngSubmit)="verificarLibro()">
      <div>
        <label for="isbn">ISBN:</label>
        <input id="isbn" formControlName="isbn" type="text" placeholder="Ingrese ISBN" />
      </div>
      <div style="display: flex; justify-content: center;">
        <button pButton type="submit" label="Buscar Libro" 
                [disabled]="buscarForm.invalid" 
                style="width: auto">
        </button>
      </div>
    </form>
  
    <div *ngIf="libroEncontrado">
      <h3>Libro encontrado</h3>
      <p><strong>Título:</strong> {{ libro.titulo }}</p>
      <p><strong>Autor:</strong> {{ libro.autor }}</p>
      <p><strong>Editorial:</strong> {{ libro.editorial }}</p>
      <p><strong>Género:</strong> {{ libro.genero }}</p>
      <p><strong>Año de publicación:</strong> {{ libro.anio_publicacion }}</p>
      <p><strong>Cantidad:</strong> {{ libro.cantidad }}</p>
  
      <button (click)="eliminarLibro()">Eliminar Libro</button>
    </div>
  
    <div *ngIf="mensajeError" class="error-message">
      <p>{{ mensajeError }}</p>
    </div>
  </div>
